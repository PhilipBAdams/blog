<input type=search id=search-input class=search-input placeholder="Search essays, concepts, or tags…" aria-label="Search essays" autocomplete=off spellcheck=false></div><p id=search-status class=search-status role=status aria-live=polite></p><ul id=search-results class=post-list></ul></div><script type=module>
const input = document.getElementById("search-input");
const statusEl = document.getElementById("search-status");
const resultsEl = document.getElementById("search-results");
const indexUrl = "/search/index.json";

let indexPromise = null;

function loadIndex() {
  if (!indexPromise) {
    indexPromise = fetch(indexUrl).then((r) => {
      if (!r.ok) throw new Error("Failed to load search index");
      return r.json();
    });
  }
  return indexPromise;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function makeSnippet(text, terms) {
  if (!text) return "";
  const lower = text.toLowerCase();
  let pos = -1;
  for (const t of terms) {
    pos = lower.indexOf(t);
    if (pos !== -1) break;
  }
  const start = Math.max(0, (pos === -1 ? 0 : pos) - 70);
  const slice = text.slice(start, start + 220).trim();
  return (start > 0 ? "…" : "") + escapeHtml(slice) + (start + 220 < text.length ? "…" : "");
}

async function runSearch(raw) {
  const q = raw.trim().toLowerCase();
  if (!q) {
    statusEl.textContent = "";
    resultsEl.innerHTML = "";
    return;
  }
  const terms = q.split(/\s+/).filter(Boolean);
  try {
    const items = await loadIndex();
    const matches = [];
    for (const item of items) {
      const hayTitle = (item.title || "").toLowerCase();
      const hayTags = (item.tags || []).join(" ").toLowerCase();
      const hayDesc = (item.description || "").toLowerCase();
      const hayBody = (item.content || "").toLowerCase();
      let score = 0;
      let allMatch = true;
      for (const t of terms) {
        let hit = false;
        if (hayTitle.includes(t)) { score += 10; hit = true; }
        if (hayTags.includes(t)) { score += 6; hit = true; }
        if (hayDesc.includes(t)) { score += 4; hit = true; }
        if (hayBody.includes(t)) { score += 1; hit = true; }
        if (!hit) { allMatch = false; break; }
      }
      if (allMatch) matches.push({ item, score });
    }
    matches.sort((a, b) => b.score - a.score);
    statusEl.textContent = `${matches.length} ${matches.length === 1 ? "result" : "results"}`;
    resultsEl.innerHTML = matches.map(({ item }) => {
      const snippet = item.description ? escapeHtml(item.description) : makeSnippet(item.content, terms);
      return `<li class="post-card">
        <div class="post-card-meta"><time>${escapeHtml(item.date || "")}</time></div>
        <h2 class="post-card-title"><a href="${escapeHtml(item.relPermalink)}">${escapeHtml(item.title)}</a></h2>
        <p class="post-card-summary">${snippet}</p>
      </li>`;
    }).join("");
  } catch {
    statusEl.textContent = "Unable to load search index.";
  }
}

input?.addEventListener("focus", () => { loadIndex(); }, { once: true });
input?.addEventListener("input", () => {
  const val = input.value;
  const url = new URL(window.location.href);
  if (val.trim()) url.searchParams.set("q", val.trim());
  else url.searchParams.delete("q");
  window.history.replaceState(null, "", url);
  runSearch(val);
});

const initial = new URLSearchParams(window.location.search).get("q");
if (initial && input) {
  input.value = initial;
  runSearch(initial);
}
